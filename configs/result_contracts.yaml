contracts:
  - name: pair_scores
    path: smoke_pair_scores.jsonl
    version: v1
    evidence_status: MOCK_ONLY
    required_fields:
      - run_id
      - item_id
      - provider_name
      - model_name
      - task_family
      - domain
      - original_correct
      - edited_correct
      - consistent
      - required_change
      - parse_ok
      - metadata
  - name: model_comparison
    path: model_comparison/comparison_summary.json
    version: v1
    evidence_status: DESCRIPTIVE_ONLY
    required_fields:
      - n_scores
      - n_models
      - rankings
      - significance_claims_made
  - name: claim_ledger
    path: smoke_report/claim_ledger.json
    version: v1
    evidence_status: MOCK_ONLY
    required_fields:
      - entries

